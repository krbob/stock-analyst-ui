name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ci-required
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Lint container files
        run: |
          docker run --rm -i hadolint/hadolint:v2.14.0-alpine@sha256:7aba693c1442eb31c0b015c129697cb3b6cb7da589d85c7562f9deb435a6657c hadolint --failure-threshold error - < Dockerfile
          docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d docker-entrypoint.sh

      - name: Validate Compose quick start
        run: docker compose config --quiet

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          check-latest: false
          cache: 'npm'

      - name: Verify documentation contracts
        run: npm run docs:check

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify OpenAPI snapshot and generated client
        run: npm run contract:check

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests with all-source coverage
        run: npm run test:coverage

      - name: Publish coverage summary
        run: |
          set -o pipefail
          npm run --silent coverage:report | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: stock-analyst-ui:test
          cache-from: type=gha,scope=stock-analyst-ui
          cache-to: type=gha,mode=max,scope=stock-analyst-ui

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: |
          if docker run --rm stock-analyst-ui:test; then
            echo "Container started without required API_URL"
            exit 1
          fi

          docker run -d --name ui -p 3000:8080 \
            -e API_URL=http://localhost:8080 \
            -e 'PORTFOLIO_URL=https://portfolio.example/app?tenant=personal' \
            stock-analyst-ui:test
          trap 'docker rm -f ui >/dev/null 2>&1 || true' EXIT

          ready=0
          for _ in $(seq 1 15); do
            if curl -sf http://localhost:3000/healthz > /dev/null 2>&1; then
              echo "Container is serving traffic"
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs ui
            exit 1
          fi

          curl -sf http://localhost:3000 | grep -q "Stock Analyst"
          curl -sSI http://localhost:3000/runtime-config.js | grep -qi 'Cache-Control:.*no-store'
          BASE_URL=http://localhost:3000 npm run test:e2e:ci
          echo "Smoke test passed"

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/stock-analyst-ui"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}
            ${{ steps.image.outputs.image }}:latest
          cache-from: type=gha,scope=stock-analyst-ui
          cache-to: type=gha,mode=max,scope=stock-analyst-ui
          provenance: mode=max
          sbom: true
